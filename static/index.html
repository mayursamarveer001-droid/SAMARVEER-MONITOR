<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Live Screens</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{color-scheme:light dark}
 body{margin:0;font-family:Inter,system-ui,sans-serif;background:#F1F4F8;color:#0F172A}
  /* ---------- top header (ek line mein brand) ---------- */
  header.top{display:flex;align-items:center;gap:12px;background:#fff;border-bottom:1px solid #DDE3EA;padding:8px 24px;position:sticky;top:0;z-index:20}
  .brand{display:flex;align-items:center;gap:10px}
  .brand img{width:44px;height:44px;object-fit:contain;flex:none}
  .brand span{font-weight:700;font-size:16px;color:#1D4ED8;white-space:nowrap;letter-spacing:.3px}
  #conn{margin-left:auto;font-size:13px;color:#64748B}

  main{padding:18px 24px;box-sizing:border-box}

  /* ---------- toolbar ---------- */
  .toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:18px}
  .toolbar h1{margin:0 8px 0 0;font-size:20px;font-weight:700}
  .search{position:relative}
  .search input{width:240px;box-sizing:border-box;padding:9px 12px;border:1px solid #CBD5E1;border-radius:8px;font-size:13px;background:#fff;color:#0F172A}
  .search input:focus{outline:2px solid #93C5FD;border-color:#93C5FD}

  .dd{position:relative}
  .dd > button,.seg button{font:600 13px Inter,sans-serif;cursor:pointer}
  .dd > button{padding:9px 14px;border:1px solid #CBD5E1;border-radius:8px;background:#fff;color:#0F172A;min-width:190px;text-align:left}
  .panel{display:none;position:absolute;top:calc(100% + 6px);left:0;width:260px;max-height:340px;overflow:auto;background:#fff;border:1px solid #DDE3EA;border-radius:10px;box-shadow:0 8px 24px rgba(15,23,42,.15);padding:8px;z-index:30}
  .panel.open{display:block}
  .panel .acts{display:flex;gap:8px;padding:2px 4px 8px;border-bottom:1px solid #E8ECF1;margin-bottom:6px}
  .panel .acts button{background:none;border:0;color:#1D4ED8;font:600 12px Inter,sans-serif;cursor:pointer;padding:2px 4px}
  .panel label{display:flex;align-items:center;gap:8px;padding:6px 6px;border-radius:6px;font-size:13px;cursor:pointer;color:#0F172A}
  .panel label:hover{background:#F1F5F9}
  .panel .dot{width:8px;height:8px;border-radius:50%;background:#94A3B8;margin-left:auto;flex:none}
  .panel .dot.on{background:#16A34A}

  .seg{display:flex;border:1px solid #CBD5E1;border-radius:8px;overflow:hidden;background:#fff}
  .seg button{border:0;border-right:1px solid #E2E8F0;padding:9px 14px;background:#fff;color:#334155}
  .seg button:last-child{border-right:0}
  .seg button.on{background:#1D4ED8;color:#fff}
  .lbl{font-size:12px;color:#64748B}
  #count{margin-left:auto;font-size:13px;color:#64748B}

  /* ---------- grid ---------- */
  .grid{display:grid;gap:18px}
  .grid.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid.g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid.g6{grid-template-columns:repeat(3,minmax(0,1fr))}
  .grid.gall{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
  @media(max-width:700px){.grid.g2,.grid.g4,.grid.g6{grid-template-columns:1fr}}

  .tile{background:#fff;border:1px solid #DDE3EA;border-radius:10px;overflow:hidden}
  .scr{aspect-ratio:16/9;position:relative;margin:10px 10px 0;border-radius:6px;overflow:hidden;background:#111;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .scr img{width:100%;height:100%;object-fit:cover;display:block}
  .scr .placeholder{color:#94A3B8;font-size:12px}
  .badge{position:absolute;top:8px;left:8px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px}
  .live{background:#14532D;color:#fff}
  .off{background:#64748B;color:#fff}
  .who{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid #E8ECF1}
  .av{width:34px;height:34px;border-radius:50%;background:#DBEAFE;color:#1E3A8A;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;flex:none}
  .nm{flex:1;min-width:0}
  .nm b{font-size:13px;font-weight:600;display:block;cursor:pointer}
  .nm b:hover{text-decoration:underline dashed #94A3B8}
  .nm small{font-size:11px;color:#475569}
  .nm input{width:100%;box-sizing:border-box;font-size:13px;padding:3px 6px;border:1px solid #93C5FD;border-radius:4px;margin-bottom:2px}
  button.start{background:#15803D;color:#fff;border:0;border-radius:6px;font:600 13px Inter,sans-serif;padding:0 16px;min-height:40px;cursor:pointer;flex:none}
  button.start.active{background:#B91C1C}
  button.start:disabled{background:#CBD5E1;color:#334155;cursor:not-allowed}
  button.saveName{background:#1D4ED8;color:#fff;border:0;border-radius:4px;font-size:11px;padding:3px 8px;cursor:pointer;margin-top:2px}

  .empty{grid-column:1/-1;text-align:center;color:#64748B;padding:60px 0;font-size:14px}

  .pager{display:none;align-items:center;justify-content:center;gap:12px;margin-top:20px;font-size:13px;color:#475569}
  .pager.show{display:flex}
  .pager button{border:1px solid #CBD5E1;background:#fff;border-radius:6px;padding:7px 14px;font:600 13px Inter,sans-serif;cursor:pointer;color:#0F172A}
  .pager button:disabled{opacity:.45;cursor:not-allowed}

  #modal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:40;flex-direction:column}
  #modal.open{display:flex}
  #modal img{max-width:92vw;max-height:80vh;border-radius:8px}
  #modal .modalTitle{color:#fff;font-weight:600;margin-bottom:12px}
  #modal .closeBtn{position:absolute;top:16px;right:20px;color:#fff;font-size:28px;cursor:pointer;background:none;border:0}

  /* ---------- report slide panel (polished) ---------- */
  #overlay{position:fixed;inset:0;background:rgba(15,23,42,.35);display:none;z-index:45}
  #overlay.open{display:block}
  #reportPanel{position:fixed;top:0;right:-400px;width:380px;max-width:92vw;height:100vh;background:#F8FAFC;border-left:1px solid #DDE3EA;box-shadow:-12px 0 32px rgba(15,23,42,.18);transition:right .28s cubic-bezier(.4,0,.2,1);z-index:50;display:flex;flex-direction:column;overflow:hidden}
  #reportPanel.open{right:0}

  .repHead{background:#fff;border-bottom:1px solid #E8ECF1;padding:20px 22px 16px;flex:none}
  .repHead .repTop{display:flex;align-items:flex-start;justify-content:space-between}
  .repHead h2{margin:0;font-size:17px;font-weight:700;color:#0F172A}
  .repHead .repSub{margin:2px 0 0;font-size:12px;color:#64748B}
  #reportPanel .repClose{background:#F1F5F9;border:0;width:30px;height:30px;border-radius:50%;font-size:17px;cursor:pointer;color:#475569;line-height:1;flex:none}
  #reportPanel .repClose:hover{background:#E2E8F0}

  .repStats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
  .repStat{border-radius:10px;padding:10px 8px;text-align:center}
  .repStat .n{font-size:20px;font-weight:700;display:block;line-height:1.1}
  .repStat .l{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;opacity:.85}
  .repStat.live{background:#ECFDF3;color:#15803D}
  .repStat.idle{background:#FEF3C7;color:#92400E}
  .repStat.offline{background:#F1F5F9;color:#475569}

  .repBody{flex:1;overflow-y:auto;padding:4px 22px 24px}
  .repSection{margin-top:20px}
  .repSection h3{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;color:#334155;margin:0 0 10px;text-transform:uppercase;letter-spacing:.04em}
  .repSection h3 .dotIcon{width:8px;height:8px;border-radius:50%;flex:none}
  .repSection h3 .cnt{margin-left:auto;background:#E2E8F0;color:#475569;font-size:11px;font-weight:700;padding:1px 8px;border-radius:99px;text-transform:none;letter-spacing:0}

  .repList{display:flex;flex-direction:column;gap:6px}
  .repRow{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #E8ECF1;border-radius:10px;padding:9px 10px}
  .repRow .ravatar{width:30px;height:30px;border-radius:50%;background:#DBEAFE;color:#1E3A8A;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
  .repRow .rinfo{flex:1;min-width:0}
  .repRow .rname{font-size:13px;font-weight:600;color:#0F172A;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .repRow .rnote{font-size:11px;color:#DC2626;font-weight:600}
  .repRow .rtime{flex:none;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}
  .repRow.idle .rtime{background:#FEF3C7;color:#92400E}
  .repRow.offline .rtime{background:#F1F5F9;color:#475569}

  .repEmpty{font-size:12.5px;color:#94A3B8;padding:14px 10px;text-align:center;background:#fff;border:1px dashed #E2E8F0;border-radius:10px}
  #reportBtn{padding:9px 14px;border:1px solid #CBD5E1;border-radius:8px;background:#fff;color:#0F172A;font:600 13px Inter,sans-serif;cursor:pointer;display:flex;align-items:center;gap:6px}
  #reportBtn .rbDot{width:7px;height:7px;border-radius:50%;background:#16A34A}
</style>
</head>
<body>

<div id="modal">
  <button class="closeBtn" id="closeModal">&times;</button>
  <div class="modalTitle" id="modalTitle"></div>
  <img id="modalImg">
</div>

<div id="overlay"></div>
<div id="reportPanel">
  <div class="repHead">
    <div class="repTop">
      <div>
        <h2>Status Report</h2>
        <p class="repSub">Live view of your team right now</p>
      </div>
      <button class="repClose" id="reportClose">&times;</button>
    </div>
    <div class="repStats">
      <div class="repStat live"><span class="n" id="statLive">0</span><span class="l">Live</span></div>
      <div class="repStat idle"><span class="n" id="statIdle">0</span><span class="l">Idle</span></div>
      <div class="repStat offline"><span class="n" id="statOffline">0</span><span class="l">Offline</span></div>
    </div>
  </div>
  <div class="repBody">
    <div class="repSection">
      <h3><span class="dotIcon" style="background:#D97706"></span>Idle / On Break<span class="cnt" id="repIdleCount">0</span></h3>
      <div class="repList" id="repIdle"></div>
    </div>
    <div class="repSection">
      <h3><span class="dotIcon" style="background:#64748B"></span>Offline / Not Live Today<span class="cnt" id="repOfflineCount">0</span></h3>
      <div class="repList" id="repOffline"></div>
    </div>
  </div>
</div>

<main>
  <div class="toolbar">
    <h1>Live Screens</h1>

    <div class="search">
      <input id="q" type="search" placeholder="Search employee name…" autocomplete="off">
    </div>

    <div class="dd" id="dd">
      <button id="ddBtn" type="button">Employees: All ▾</button>
      <div class="panel" id="panel">
        <div class="acts">
          <button type="button" id="selAll">Select all</button>
          <button type="button" id="selNone">Clear</button>
        </div>
        <div id="empList"></div>
      </div>
    </div>

    <span class="lbl">View:</span>
    <div class="seg" id="seg">
      <button type="button" data-n="2">2</button>
      <button type="button" data-n="4">4</button>
      <button type="button" data-n="6">6</button>
      <button type="button" data-n="0" class="on">All</button>
    </div>

    <button id="reportBtn" type="button"><span class="rbDot"></span>Report</button>

    <span id="count"></span>
  </div>

  <div class="grid gall" id="grid"></div>

  <div class="pager" id="pager">
    <button id="prev" type="button">← Prev</button>
    <span id="pageInfo"></span>
    <button id="next" type="button">Next →</button>
  </div>
</main>

<script>
const modal = document.getElementById("modal");
const modalImg = document.getElementById("modalImg");
const modalTitle = document.getElementById("modalTitle");
const grid = document.getElementById("grid");
const connEl = document.getElementById("conn");
const qEl = document.getElementById("q");
const ddBtn = document.getElementById("ddBtn");
const panel = document.getElementById("panel");
const empList = document.getElementById("empList");
const countEl = document.getElementById("count");
const pager = document.getElementById("pager");
const pageInfo = document.getElementById("pageInfo");
const prevBtn = document.getElementById("prev");
const nextBtn = document.getElementById("next");
const reportPanel = document.getElementById("reportPanel");
const overlay = document.getElementById("overlay");

const employees = new Map();
let editingId = null;
let reportOpen = false;

// ---- filter / layout state ----
let query = "";
const selected = new Set();   // empty = sabhi employees
let perPage = 0;              // 2 / 4 / 6 / 0 (=All) - default All
let page = 0;

document.getElementById("closeModal").onclick = () => modal.classList.remove("open");
modal.onclick = (e) => { if (e.target === modal) modal.classList.remove("open"); };

function initials(name) {
  return name.split(" ").filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join("");
}
function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function nameOf(e, id) { return (e && e.name) || id; }

function openModal(e) {
  if (!e.imgUrl) return;
  modalImg.src = e.imgUrl;
  modalTitle.textContent = e.name || e.id;
  modal.classList.add("open");
}

/* ================= REPORT PANEL ================= */
function formatDuration(sinceEpochSeconds) {
  if (!sinceEpochSeconds) return "—";
  const secs = Math.max(0, Math.floor(Date.now() / 1000 - sinceEpochSeconds));
  const h = Math.floor(secs / 3600);
  const m = Math.floor((secs % 3600) / 60);
  if (h > 0) return `${h}h ${m}m`;
  if (m > 0) return `${m}m`;
  return `${secs}s`;
}

function renderReport() {
  const all = [...employees.values()];
  const liveList = all.filter(e => e.online && e.streaming);
  const idleList = all.filter(e => e.online && !e.streaming);
  const offlineList = all.filter(e => !e.online);

  document.getElementById("statLive").textContent = liveList.length;
  document.getElementById("statIdle").textContent = idleList.length;
  document.getElementById("statOffline").textContent = offlineList.length;
  document.getElementById("repIdleCount").textContent = idleList.length;
  document.getElementById("repOfflineCount").textContent = offlineList.length;

  document.getElementById("repIdle").innerHTML = idleList.length
    ? idleList.map(e => `
        <div class="repRow idle">
          <span class="ravatar">${esc(initials(e.name || e.id))}</span>
          <div class="rinfo"><div class="rname">${esc(e.name || e.id)}</div></div>
          <span class="rtime">${formatDuration(e.idle_since)}</span>
        </div>`).join("")
    : `<div class="repEmpty">Koi idle / break par nahi hai</div>`;

  document.getElementById("repOffline").innerHTML = offlineList.length
    ? offlineList.map(e => `
        <div class="repRow offline">
          <span class="ravatar">${esc(initials(e.name || e.id))}</span>
          <div class="rinfo">
            <div class="rname">${esc(e.name || e.id)}</div>
            ${e.online_today ? "" : `<div class="rnote">Aaj online nahi hui</div>`}
          </div>
          <span class="rtime">${formatDuration(e.offline_since)}</span>
        </div>`).join("")
    : `<div class="repEmpty">Sab online hain</div>`;
}

function toggleReport() {
  reportOpen = !reportOpen;
  reportPanel.classList.toggle("open", reportOpen);
  overlay.classList.toggle("open", reportOpen);
  if (reportOpen) renderReport();
}
document.getElementById("reportBtn").onclick = toggleReport;
document.getElementById("reportClose").onclick = toggleReport;
overlay.onclick = toggleReport;

/* ================= FILTERS ================= */
function filteredList() {
  const q = query.trim().toLowerCase();
  const out = [];
  for (const [id, e] of employees) {
    if (selected.size && !selected.has(id)) continue;
    if (q && !nameOf(e, id).toLowerCase().includes(q)) continue;
    out.push([id, e]);
  }
  return out;
}
function visibleList() {
  const all = filteredList();
  if (!perPage) return { items: all, total: all.length, pages: 1 };
  const pages = Math.max(1, Math.ceil(all.length / perPage));
  if (page >= pages) page = pages - 1;
  if (page < 0) page = 0;
  return { items: all.slice(page * perPage, page * perPage + perPage), total: all.length, pages };
}
function isVisible(id) {
  return visibleList().items.some(([i]) => i === id);
}

qEl.oninput = () => { query = qEl.value; page = 0; editingId = null; draw(); };

document.getElementById("seg").onclick = (ev) => {
  const b = ev.target.closest("button[data-n]");
  if (!b) return;
  perPage = parseInt(b.dataset.n, 10);
  page = 0;
  document.querySelectorAll("#seg button").forEach(x => x.classList.toggle("on", x === b));
  draw();
};

prevBtn.onclick = () => { page--; draw(); };
nextBtn.onclick = () => { page++; draw(); };

// ---- employee multi-select dropdown ----
ddBtn.onclick = (ev) => { ev.stopPropagation(); panel.classList.toggle("open"); };
panel.onclick = (ev) => ev.stopPropagation();
document.addEventListener("click", () => panel.classList.remove("open"));

document.getElementById("selAll").onclick = () => {
  employees.forEach((_, id) => selected.add(id));
  page = 0; buildEmpList(); draw();
};
document.getElementById("selNone").onclick = () => {
  selected.clear();
  page = 0; buildEmpList(); draw();
};

function buildEmpList() {
  const arr = [...employees].sort((a, b) => nameOf(a[1], a[0]).localeCompare(nameOf(b[1], b[0])));
  empList.innerHTML = arr.map(([id, e]) => `
    <label>
      <input type="checkbox" data-id="${esc(id)}" ${selected.has(id) ? "checked" : ""}>
      <span>${esc(nameOf(e, id))}</span>
      <i class="dot ${e.online ? "on" : ""}"></i>
    </label>`).join("");
  empList.querySelectorAll("input").forEach(cb => {
    cb.onchange = () => {
      if (cb.checked) selected.add(cb.dataset.id); else selected.delete(cb.dataset.id);
      page = 0; updateDdLabel(); draw();
    };
  });
  updateDdLabel();
}
function updateDdLabel() {
  const n = selected.size;
  let t = "All";
  if (n === 1) { const id = [...selected][0]; t = nameOf(employees.get(id), id); }
  else if (n > 1) t = n + " selected";
  ddBtn.textContent = "Employees: " + t + " ▾";
}

/* ================= RENAME ================= */
function startEdit(id) {
  editingId = id;
  draw();
  const input = document.getElementById("nameInput");
  if (input) { input.focus(); input.select(); }
}
function commitRename(id, newName) {
  newName = (newName || "").trim();
  if (newName) {
    ws.send(JSON.stringify({ type: "rename", id, name: newName }));
    const e = employees.get(id);
    if (e) e.name = newName;
    buildEmpList();
  }
  editingId = null;
  draw();
}
function cancelEdit() { editingId = null; draw(); }

/* ================= RENDER ================= */
function render() {
  if (editingId) return;
  draw();
}

function draw() {
  const { items, total, pages } = visibleList();

  grid.className = "grid " + (perPage === 0 ? "gall" : "g" + perPage);
  grid.innerHTML = "";

  if (!items.length) {
    grid.innerHTML = `<div class="empty">Koi employee nahi mila</div>`;
  }

  for (const [id, e] of items) {
    const tile = document.createElement("div");
    tile.className = "tile";

    const nameBlock = (id === editingId)
      ? `<input id="nameInput" value="${esc(e.name || id)}">
         <button class="saveName" data-id="${esc(id)}">Save</button>`
      : `<b data-id="${esc(id)}" class="editName" title="Click to rename">${esc(e.name || id)}</b><small>${esc(e.role || "")}</small>`;

    tile.innerHTML = `
      <div class="scr" data-id="${esc(id)}">
        ${e.imgUrl ? `<img src="${e.imgUrl}">` : `<span class="placeholder">${e.online ? "Waiting for frame…" : "No signal"}</span>`}
        <span class="badge ${e.online ? "live" : "off"}">${e.online ? (e.streaming ? "Live" : "Idle") : "Offline"}</span>
      </div>
      <div class="who">
        <span class="av">${esc(initials(e.name || id))}</span>
        <div class="nm">${nameBlock}</div>
        <button class="start ${e.streaming ? "active" : ""}" data-id="${esc(id)}" ${e.online ? "" : "disabled"}>
          ${e.streaming ? "Stop" : "Start"}
        </button>
      </div>`;
    grid.appendChild(tile);
  }

  countEl.textContent = `Showing ${items.length} of ${total}` + (total !== employees.size ? ` (total ${employees.size})` : "");

  pager.classList.toggle("show", pages > 1);
  pageInfo.textContent = `Page ${page + 1} / ${pages}`;
  prevBtn.disabled = page <= 0;
  nextBtn.disabled = page >= pages - 1;

  grid.querySelectorAll(".scr").forEach(div => {
    div.onclick = () => openModal(employees.get(div.dataset.id));
  });
  grid.querySelectorAll("button.start").forEach(btn => {
    btn.onclick = (ev) => {
      ev.stopPropagation();
      const id = btn.dataset.id;
      const e = employees.get(id);
      ws.send(JSON.stringify({ type: e.streaming ? "stop" : "start", id }));
    };
  });
  grid.querySelectorAll(".editName").forEach(el => {
    el.onclick = (ev) => { ev.stopPropagation(); startEdit(el.dataset.id); };
  });
  grid.querySelectorAll("button.saveName").forEach(btn => {
    btn.onclick = (ev) => {
      ev.stopPropagation();
      const input = document.getElementById("nameInput");
      commitRename(btn.dataset.id, input ? input.value : "");
    };
  });
  const input = document.getElementById("nameInput");
  if (input) {
    input.onkeydown = (ev) => {
      if (ev.key === "Enter") commitRename(editingId, input.value);
      else if (ev.key === "Escape") cancelEdit();
    };
  }
}

/* ================= WEBSOCKET ================= */
let ws;
function connect() {
  const WS_PROTOCOL = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(`${WS_PROTOCOL}://${location.host}/ws/admin`);
  ws.binaryType = "arraybuffer";

  ws.onopen = () => { connEl.textContent = "Connected"; };
  ws.onclose = () => { connEl.textContent = "Disconnected — retrying…"; setTimeout(connect, 3000); };
  ws.onerror = () => ws.close();

  ws.onmessage = (ev) => {
    if (typeof ev.data === "string") {
      const data = JSON.parse(ev.data);
      if (data.type === "snapshot") {
        data.employees.forEach(e => employees.set(e.id, { ...e, imgUrl: null }));
        buildEmpList();
        render();
        if (reportOpen) renderReport();
      } else if (data.type === "status") {
        const prev = employees.get(data.id) || {};
        const { type, ...rest } = data;
        employees.set(data.id, {
          ...prev, ...rest,
          streaming: rest.online ? (rest.streaming ?? prev.streaming) : false,
        });
        buildEmpList();
        render();
        if (reportOpen) renderReport();
      }
    } else {
      const bytes = new Uint8Array(ev.data);
      const nl = bytes.indexOf(10);
      const id = new TextDecoder().decode(bytes.slice(0, nl));
      const jpeg = bytes.slice(nl + 1);
      const blob = new Blob([jpeg], { type: "image/jpeg" });
      const url = URL.createObjectURL(blob);
      const prev = employees.get(id) || {};
      const oldUrl = prev.imgUrl;
      const isNew = !employees.has(id);
      employees.set(id, { ...prev, id, imgUrl: url, online: true, streaming: true });
      if (isNew) buildEmpList();

      // Sirf existing <img> swap karo (flicker nahi hoga)
      const scrDiv = grid.querySelector(`.scr[data-id="${CSS.escape(id)}"]`);
      const existingImg = scrDiv ? scrDiv.querySelector("img") : null;

      if (scrDiv && existingImg) {
        existingImg.src = url;
        const badge = scrDiv.querySelector(".badge");
        if (badge) { badge.className = "badge live"; badge.textContent = "Live"; }
      } else if (scrDiv) {
        scrDiv.innerHTML = `<img src="${url}"><span class="badge live">Live</span>`;
      } else if (isVisible(id)) {
        // tile abhi DOM mein nahi hai par filter ke hisaab se dikhna chahiye
        render();
      }
      // filter se hidden employee ka frame: sirf data save, koi redraw nahi

      if (oldUrl) setTimeout(() => URL.revokeObjectURL(oldUrl), 1000);

      if (modal.classList.contains("open") && modalTitle.textContent === (employees.get(id).name || id)) {
        modalImg.src = url;
      }
    }
  };
}
connect();

// Report mein dikhai gayi duration (Xh Ym) ko har 30 second mein taaza karte rahein
setInterval(() => { if (reportOpen) renderReport(); }, 30000);
</script>
